name: Download complete Obryx ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-iso.yml']
  workflow_run:
    workflows: ["Build Obryx OS Live ISO"]
    branches: [onyx-0.4-desktop]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: onyx-complete-alpha4
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HF_TOKEN: ${{ secrets.HF_SECRET }}
      HF_REPO_NAME: Obryx-OS
      ISO: Obryx-OS-0.4-Alpha4-x86_64.iso
      TAG: v0.4.0-alpha.4
      EXPECTED_BYTES: '3678285824'
    steps:
      - name: Check Hugging Face access
        id: hf
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::The HF_SECRET repository secret is missing. Add a Hugging Face write token under Settings > Secrets and variables > Actions.'
            exit 1
          fi
          python3 -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=0.34'
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          from huggingface_hub.utils import EntryNotFoundError, RepositoryNotFoundError
          api = HfApi()
          user = api.whoami()['name']
          repo_id = f"{user}/{os.environ['HF_REPO_NAME']}"
          api.create_repo(repo_id, private=True, exist_ok=True)
          uploaded = 'false'
          try:
              [info] = api.get_paths_info(repo_id, [os.environ['ISO']])
              if getattr(info, 'size', 0) == int(os.environ['EXPECTED_BYTES']):
                  uploaded = 'true'
          except (EntryNotFoundError, RepositoryNotFoundError, ValueError):
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'repo={repo_id}\nuploaded={uploaded}\n')
          PY

      - name: Download and verify complete release image
        if: steps.hf.outputs.uploaded != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir parts complete
          # Retry transient download errors, not checksum or validation failures.
          download() {
            for attempt in 1 2 3; do
              if gh release download "$TAG" --clobber "$@"; then return 0; fi
              if [ "$attempt" -eq 3 ]; then return 1; fi
              sleep "$((attempt * 5))"
            done
          }
          gh release view "$TAG" --json assets > release.json
          if jq -e --arg name "$ISO" '.assets[] | select(.name == $name)' release.json >/dev/null; then
            download --pattern "$ISO" --dir complete
          else
            download --pattern "$ISO.part*" --dir parts
            python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          name = os.environ['ISO']
          parts = sorted(Path('parts').glob(name + '.part*'))
          if not parts or [p.name for p in parts] != [f'{name}.part{i:02d}' for i in range(len(parts))]:
              raise SystemExit('Missing or unexpected ISO parts')
          with (Path('complete') / name).open('wb') as dest:
              for part in parts:
                  with part.open('rb') as source:
                      shutil.copyfileobj(source, dest)
                  part.unlink()
          PY
          fi
          download --pattern "$ISO.sha256" --dir complete
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          name = os.environ['ISO']
          iso = Path('complete') / name
          if iso.stat().st_size != int(os.environ['EXPECTED_BYTES']):
              raise SystemExit('Unexpected Alpha 4 ISO size; do not upload')
          checksum = Path(str(iso) + '.sha256').read_text().strip()
          if not re.fullmatch(r'[0-9a-fA-F]{64} [ *]' + re.escape(name), checksum):
              raise SystemExit('Unexpected checksum manifest; do not upload')
          PY
          (cd complete && sha256sum -c "$ISO.sha256")
          rm -rf parts

      - name: Upload single ISO to Hugging Face
        if: steps.hf.outputs.uploaded != 'true'
        env:
          HF_REPO: ${{ steps.hf.outputs.repo }}
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              repo_id=os.environ['HF_REPO'],
              folder_path='complete',
              commit_message=f"Obryx OS {os.environ['TAG']} complete ISO",
          )
          PY

      - name: Show download link
        env:
          HF_REPO: ${{ steps.hf.outputs.repo }}
          ALREADY: ${{ steps.hf.outputs.uploaded }}
        shell: bash
        run: |
          url="https://huggingface.co/$HF_REPO/resolve/main/$ISO?download=true"
          {
            if [ "$ALREADY" = 'true' ]; then echo 'The complete ISO was already on Hugging Face, so nothing was re-uploaded.'; echo; fi
            echo "Download the complete ISO (one file, no combining): $url"
            echo
            echo "Checksum: https://huggingface.co/$HF_REPO/resolve/main/$ISO.sha256"
            echo
            echo 'The Hugging Face repo is private: sign in to huggingface.co in your browser first. Then select the .iso in Rufus.'
          } >> "$GITHUB_STEP_SUMMARY"
