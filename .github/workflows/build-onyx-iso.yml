name: Build ONYX OS Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - onyx-0.3-desktop
      - onyx-0.4-desktop

concurrency:
  group: onyx-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free cloud-runner disk
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h /
      - name: Check source files
        run: bash build-onyx-iso.sh --check
      - name: Exercise ONYX Home, application search and Settings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gir1.2-gtk-3.0 python3-gi xvfb xauth dbus-daemon librsvg2-bin
          bash tools/render-shell-icons.sh
          xvfb-run -a dbus-run-session -- /usr/bin/python3 tools/check-onyx-shell.py previews
      - name: Save native desktop previews
        uses: actions/upload-artifact@v4
        with:
          name: onyx-glass-previews
          path: previews/*.png
          retention-days: 7
        continue-on-error: true
      - name: Build Fedora KDE image
        shell: bash
        run: |
          docker run --rm --privileged --network=host \
            -v /dev:/dev \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e ONYX_WORKDIR=/workspace/work \
            -e ONYX_OUTPUT=/workspace/output \
            fedora:45 bash /workspace/build-onyx-iso.sh
      - name: Verify ISO and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s output/ONYX-OS-0.4-Alpha1-x86_64.iso
          test -s output/ONYX-OS-0.4-Alpha1-x86_64.iso.sha256
          (cd output && sha256sum --check ONYX-OS-0.4-Alpha1-x86_64.iso.sha256)
          file output/ONYX-OS-0.4-Alpha1-x86_64.iso
          ls -lh output/ONYX-OS-0.4-Alpha1-x86_64.iso
          echo "NOTE: ISO signature and checksum are valid; live desktop boot still needs testing."
      - name: Boot the release in a diskless UEFI VM
        timeout-minutes: 25
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf tesseract-ocr python3-pil python3-opencv
          sudo /usr/bin/python3 tools/test-live-desktop.py output/ONYX-OS-0.4-Alpha1-x86_64.iso
      - name: Save live session screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-live-session
          path: |
            vm-test/*.png
            vm-test/journal.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Make live previews readable for remote review
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image
          folder = Path("vm-test")
          names = ["home.png", "settings.png", "file-manager.png", "dock-idle.png", "dock-hover.png"]
          paths = [folder / name for name in names]
          paths += sorted(folder.glob("boot-*.png"))[-3:]
          for path in paths:
              if not path.is_file():
                  continue
              with Image.open(path) as picture:
                  picture.thumbnail((960, 600))
                  buffer = io.BytesIO()
                  picture.save(buffer, format="PNG")
              print("::group::Live preview " + path.name)
              print("ONYX_PREVIEW_START " + path.name)
              print(base64.encodebytes(buffer.getvalue()).decode("ascii"))
              print("ONYX_PREVIEW_END")
              print("::endgroup::")
          PY
      # Releases permit large assets without the GitHub Actions artifact quota.
      # GitHub release assets must each be smaller than 2 GiB.
      - name: Publish ONYX alpha ISO to private GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TAG="v0.4.0-alpha.1"
          ISO="output/ONYX-OS-0.4-Alpha1-x86_64.iso"
          SHA="$ISO.sha256"
          # The ISO is created as root inside the Fedora Docker container.
          # Make the output directory writable by the GitHub runner so
          # split ISO assets (.part00, .part01, ...) can be created.
          sudo chown -R "$(id -u):$(id -g)" output
          test -w output
          test -r "$ISO"
          df -h .
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "ONYX OS 0.4 Alpha 1 — Glass Desktop" \
              --notes "Live USB alpha. Validated in a diskless UEFI virtual machine." \
              --prerelease
          fi
          gh release upload "$TAG" "$SHA" vm-test/desktop.png vm-test/home.png vm-test/settings.png --clobber
          SIZE=$(stat -c %s "$ISO")
          SINGLE_LIMIT=$((1800 * 1024 * 1024))
          if (( SIZE < SINGLE_LIMIT )); then
            gh release upload "$TAG" "$ISO" --clobber
          else
            echo "ISO exceeds safe single-asset size; uploading numbered parts."
            gh release upload "$TAG" tools/COMBINE-ONYX-WINDOWS.cmd --clobber
            # The Fedora image is generated by root inside Docker; its
            # output/ directory is root-owned. Do not write split files there.
            PART_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/onyx-parts.XXXXXXXX")"
            trap 'rm -rf -- "$PART_DIR"' EXIT
            PART_SIZE_MIB=900
            partnum=0
            while (( partnum * PART_SIZE_MIB * 1024 * 1024 < SIZE )); do
              printf -v PART '%s/ONYX-OS-0.4-Alpha1-x86_64.iso.part%02d' "$PART_DIR" "$partnum"
              dd if="$ISO" of="$PART" bs=1M skip="$((partnum * PART_SIZE_MIB))" count="$PART_SIZE_MIB" status=none
              test -s "$PART"
              gh release upload "$TAG" "$PART" --clobber
              sha256sum "$PART" | awk -v name="$(basename "$PART")" '{print $1 "  " name}' >> "$PART_DIR/parts.sha256"
              rm -f "$PART"
              (( partnum += 1 ))
            done
            gh release download "$TAG" --pattern '*.part*' --pattern '*.cmd' --pattern '*.iso.sha256' --dir "$PART_DIR"
            (cd "$PART_DIR" && sha256sum -c parts.sha256 && cat *.part[0-9][0-9] | sha256sum > rebuilt.sha256)
            test "$(cut -d' ' -f1 "$PART_DIR/rebuilt.sha256")" = "$(cut -d' ' -f1 "$SHA")"
            cmp "$SHA" "$PART_DIR/$(basename "$SHA")"
            cmp tools/COMBINE-ONYX-WINDOWS.cmd "$PART_DIR/COMBINE-ONYX-WINDOWS.cmd"
            cat "$PART_DIR/rebuilt.sha256"
          fi
          gh release view "$TAG" --json url --jq .url
